<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="stickerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff3b30" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0c0c0e" stop-opacity="0.95"/>
    </radialGradient>
    <linearGradient id="stickerBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b30"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <!-- Outer Octagon / Circle -->
  <circle cx="200" cy="200" r="185" fill="#09090b" stroke="url(#stickerBorder)" stroke-width="8"/>
  <circle cx="200" cy="200" r="172" fill="#121216" stroke="#27272a" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Background Texture Dots -->
  <circle cx="200" cy="200" r="160" fill="url(#stickerGlow)"/>

  <!-- Circular Text Path -->
  <path id="textPathTop" d="M 60,200 A 140,140 0 0,1 340,200" fill="none"/>
  <text font-family="'Space Grotesk', -apple-system, sans-serif" font-size="14" font-weight="700" fill="#a1a1aa" letter-spacing="4">
    <textPath href="#textPathTop" startOffset="50%" text-anchor="middle">
      KABIR GUREJA • ARCHIVE 2025
    </textPath>
  </text>

  <path id="textPathBottom" d="M 340,200 A 140,140 0 0,1 60,200" fill="none"/>
  <text font-family="'Space Grotesk', -apple-system, sans-serif" font-size="13" font-weight="700" fill="#ef4444" letter-spacing="3">
    <textPath href="#textPathBottom" startOffset="50%" text-anchor="middle">
      ★ ROBOTICS &amp; AI LAB CERTIFIED ★
    </textPath>
  </text>

  <!-- Center Monogram Box -->
  <rect x="120" y="140" width="160" height="120" rx="16" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
  
  <text x="200" y="195" font-family="'Syne', 'Clash Display', sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">
    KG<tspan fill="#ff3b30">.</tspan>
  </text>
  
  <text x="200" y="228" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#10b981" text-anchor="middle" letter-spacing="3">
    [PEEL &amp; DRAG]
  </text>

  <!-- Accent Corner Marks -->
  <path d="M 175,90 L 225,90" stroke="#ff3b30" stroke-width="3" stroke-linecap="round"/>
  <path d="M 175,310 L 225,310" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
</svg>
